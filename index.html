<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Formulário</title>
</head>

<body>
    <div class="container">
        <h1>Formulário de Inscrição</h1>

        <div class="erro" id="erro"></div>

        <form id="form">
            <div class="div1">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome aqui">
            </div>

            <div class="div2">
                <label for="sobrenome">Sobrenome:</label>
                <input type="text" id="sobrenome" name="sobrenome" placeholder="Digite seu sobrenome aqui">
            </div>

            <div class="div3">
                <label for="pais">País:</label>
                <input type="text" id="pais" name="pais" placeholder="Digite seu pais aqui">
            </div>

            <button type="submit" class="submit">Enviar<button>
        </form>
    </div>

    <script src="script.js"></script>

</body>

</html>
